<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Donjon</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 
flex items-center justify-center p-5">
  <main id="jeu" class="w-full max-w-2xl space-y-4 flex flex-col gap-2">
    <h1 class="text-3xl font-bold">Donjon</h1>

    <article id="heros">
      <h2 id="heros-nom"></h2>
      <p id="heros-classe"></p>

      <p>PV : <span id="heros-pv"></span></p>
      <div class="w-full h-4 bg-gray-200">
        <div id="heros-pv-barre" class="h-4"></div>
      </div>

      <p>Mana : <span id="heros-mana"></span></p>
      <p>Attaque : <span id="heros-attaque"></span></p>
      <p>Arme : <span id="heros-arme"></span></p>
      <p>Potion : <span id="heros-potions"></span></p>
      <ol id="journal"></ol>
    </article>

    <article id="monstre">
      <h2 id="monstre-nom"></h2>

      <p>PV : <span id="monstre-pv"></span></p>

      <div class="w-full h-4 bg-gray-200">
        <div id="monstre-pv-barre" class="h-4"></div>
      </div>

      <p>Attaque : <span id="monstre-attaque"></span></p>
      <p>Défense : <span id="monstre-defense"></span></p>
    </article>
    <div id="actions">

      <button data-action="attaquer" type="button"
        class="cursor-pointer rounded bg-red-600 px-4 py-2 font-bold hover:bg-red-700">
        Attaquer
      </button>
      <button data-action="boule de feu" type="button"
        class="cursor-pointer rounded bg-red-600 px-4 py-2 font-bold hover:bg-red-700">
        Boule de feu
      </button>
      <button data-action="soin" type="button"
        class="cursor-pointer rounded bg-red-600 px-4 py-2 font-bold hover:bg-red-700">
        Soin
      </button>
      <button data-action="potion" type="button"
        class="cursor-pointer rounded bg-red-600 px-4 py-2 font-bold hover:bg-red-700">
        Potion
      </button>
      <button data-action="fuir" type="button"
        class="cursor-pointer rounded bg-red-600 px-4 py-2 font-bold hover:bg-red-700">
        Fuir
      </button>

      
    </div>
    <p id="annonce"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
